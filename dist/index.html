/* Layout: game column (max 640px) — HUD strip, pixel-art scene canvas, RPG dialog box, big touch controls. Pixel display face for names/titles only; task text stays in a readable rounded sans. */
:root {
  --bg: #f4ead3;
  --surface: #fffaf0;
  --soft: #efe3c6;
  --fg: #22301f;
  --muted: #5d6f58;
  --line: #dccba5;
  --leaf: #3f9b4a;
  --leaf-ink: #ffffff;
  --wood: #a8693a;
  --wood-dark: #6e4223;
  --gold: #ffcf3a;
  --night: #1f2540;
  --night-line: #4a5288;
  --good: #2c9a5a;
  --bad: #d4473a;
  --font-pixel: "Pixelify Sans", "Courier New", monospace;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { overflow-x: hidden; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 18px; line-height: 1.45; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button:disabled { cursor: default; opacity: .5; }
main { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }

.pixel-canvas { width: 100%; height: auto; display: block; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 6px; border: 4px solid var(--wood-dark); background: #78c850; }

h1, h2 { font-family: var(--font-pixel); font-weight: 700; margin: 0; line-height: 1.05; }
h1 { font-size: clamp(2.2rem, 9vw, 3rem); color: var(--leaf); text-align: center; letter-spacing: .02em; }
h2 { font-size: 1.6rem; }
.sub { text-align: center; margin: 0; color: var(--muted); font-weight: 700; }

/* buttons */
.btn {
  font-family: var(--font-pixel); font-weight: 700; font-size: 1.35rem; line-height: 1.1;
  background: var(--surface); border: 3px solid var(--wood-dark); border-radius: 10px;
  padding: 12px 16px; min-height: 60px; box-shadow: 0 5px 0 var(--wood-dark);
  transition: transform .08s, box-shadow .08s;
}
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--wood-dark); }
.btn.main { background: var(--leaf); color: var(--leaf-ink); }
.btn.gold { background: var(--gold); color: #3a2a00; }
.btn.small { font-size: 1rem; min-height: 44px; padding: 8px 12px; box-shadow: 0 3px 0 var(--wood-dark); }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.stack { display: grid; gap: 12px; }

/* HUD */
.hud { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hearts, .coins { display: flex; align-items: center; gap: 2px; font-family: var(--font-body); font-weight: 900; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.hearts img, .coins img, .trail img { width: 28px; height: 28px; image-rendering: pixelated; }
.hearts img.empty { filter: grayscale(1); opacity: .35; }
.coins { margin-left: auto; background: var(--surface); border: 2px solid var(--line); border-radius: 99px; padding: 2px 12px 2px 6px; }
.icon-btn { width: 46px; height: 46px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); font-size: 1.2rem; display: grid; place-items: center; }
.icon-btn[aria-pressed="false"] { opacity: .5; }
.trail { display: flex; gap: 4px; align-items: center; width: 100%; justify-content: center; }
.trail span { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--line); }
.trail span.done { background: var(--leaf); border-color: var(--leaf); }
.trail span.now { border-color: var(--gold); border-width: 3px; transform: scale(1.12); }
.trail span b { font-family: var(--font-pixel); color: var(--muted); }
.runes { width: 100%; display: flex; justify-content: center; gap: 4px; min-height: 34px; align-items: center; }
.runes b { width: 30px; height: 34px; border-radius: 6px; background: #e7e2f8; color: #3b2a77; border: 2px solid #5a4bb0; display: grid; place-items: center; font-family: var(--font-body); font-weight: 900; font-size: 1.2rem; }
.runes em { color: var(--muted); font-style: normal; font-weight: 700; font-size: .9rem; }
.trail i { flex: 0 1 12px; height: 4px; background: var(--line); border-radius: 2px; }

/* dialog */
.dialog {
  background: var(--night); color: #f4f1ff; border: 4px solid var(--night-line); border-radius: 10px;
  padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; min-height: 86px;
  box-shadow: inset 0 0 0 3px #0c0f20;
}
.dialog .who { font-family: var(--font-pixel); font-weight: 700; color: var(--gold); font-size: 1.15rem; display: block; }
.dialog .txt { font-weight: 700; font-size: 1.25rem; line-height: 1.35; display: block; }
.dialog .txt .pic { font-size: 2.2rem; vertical-align: middle; }
.dialog .body { flex: 1; min-width: 0; }
.dialog .sayerr { display: block; margin-top: 8px; font-size: .92rem; font-weight: 700; color: #ffd2a0; }
.dialog .say { flex: none; width: 46px; height: 46px; border-radius: 10px; background: #2f3866; color: #fff; font-size: 1.3rem; display: grid; place-items: center; }

/* controls */
.ctl { display: grid; gap: 12px; }
.program {
  background: var(--surface); border: 3px dashed var(--wood); border-radius: 10px; padding: 8px;
  min-height: 74px; display: flex; flex-wrap: nowrap; gap: 8px; align-items: center;
  overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; padding-top: 12px;
}
.program .blk { flex: none; }
.program .empty { color: var(--muted); font-weight: 700; align-self: center; padding: 0 6px; }
.blk { width: 50px; height: 50px; border-radius: 8px; background: var(--wood); color: #fff; font-family: var(--font-pixel); font-weight: 700; font-size: 1.7rem; position: relative; line-height: 1; border: 2px solid var(--wood-dark); }
.blk sup { position: absolute; right: -8px; top: -9px; background: var(--gold); color: #3a2a00; border-radius: 99px; font-size: .85rem; padding: 2px 6px; border: 2px solid var(--wood-dark); }
.blk.active { outline: 4px solid var(--gold); outline-offset: 2px; }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.pad .btn { font-size: 2rem; min-height: 68px; }
.times { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 10px; }
.times .wide { grid-column: span 2; font-size: 1.05rem; }
.run { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.limit { font-weight: 800; color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 12px; }
.card {
  min-height: 92px; border-radius: 14px; border: 3px solid var(--wood-dark); background: #fffaf0; color: #24160a;
  font-family: var(--font-body); font-weight: 900; font-size: 3.2rem; line-height: 1; box-shadow: 0 5px 0 var(--wood-dark);
  display: grid; place-items: center; font-variant-numeric: tabular-nums;
}
.card.sel { background: var(--gold); transform: translateY(-8px); box-shadow: 0 10px 0 var(--wood-dark); }
.sum { text-align: center; font-family: var(--font-body); font-weight: 900; font-size: 2rem; min-height: 1.3em; font-variant-numeric: tabular-nums; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; }
.opts .btn { font-size: 2rem; min-height: 76px; }
.btn.num { font-family: var(--font-body); font-weight: 900; font-size: 2.6rem; color: #24160a; background: #fffaf0; }

.foe { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.foe .power {
  background: var(--surface); border: 3px solid var(--wood-dark); border-radius: 14px; padding: 6px 16px;
  display: flex; align-items: center; gap: 10px; font-weight: 800;
}
.foe .power b { font-family: var(--font-body); font-weight: 900; font-size: 2.8rem; line-height: 1; font-variant-numeric: tabular-nums; }
.foe img, .spell img, .book img { image-rendering: pixelated; }
.spells { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.spell {
  border: 3px solid var(--wood-dark); border-radius: 14px; background: var(--surface); min-height: 84px;
  display: grid; justify-items: center; align-content: center; gap: 2px; font-weight: 800; box-shadow: 0 5px 0 var(--wood-dark);
}
.spell img { width: 44px; height: 44px; }
.spell small { display: inline-flex; align-items: center; gap: 2px; font-size: .78rem; font-weight: 800; color: var(--muted); }
.spell small img { width: 20px; height: 20px; }
.spell[aria-pressed="true"] { background: var(--gold); color: #3a2a00; transform: translateY(-4px); }
.book { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 16px; font-weight: 800; color: var(--muted); font-size: .95rem; }
.book span { display: inline-flex; align-items: center; gap: 4px; }
.book img { width: 26px; height: 26px; }
.tabs { display: flex; gap: 8px; }
.tabs .choice { flex: 1; justify-content: center; font-size: 1.1rem; }
.item .lockd { filter: brightness(0) opacity(.35); }
.sign { background: var(--wood); color: #fff7e0; font-family: var(--font-body); font-weight: 800; font-size: 1.8rem; letter-spacing: .05em; border-color: var(--wood-dark); }
.wrong { background: #fde3df !important; color: var(--bad) !important; border-color: var(--bad) !important; box-shadow: none !important; }
.right { background: #dcf5e9 !important; color: var(--good) !important; border-color: var(--good) !important; }

.slots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.slot { width: 52px; height: 60px; border-radius: 8px; border: 3px dashed var(--wood); display: grid; place-items: center; font-family: var(--font-body); font-weight: 800; font-size: 2.2rem; }
.slot.filled { border-style: solid; background: #fff7e0; color: #4a2b14; border-color: var(--wood-dark); }
.tiles { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.tile { width: 66px; height: 74px; border-radius: 10px; background: #e7e2f8; color: #3b2a77; border: 3px solid #5a4bb0; box-shadow: 0 5px 0 #5a4bb0; font-family: var(--font-body); font-weight: 800; font-size: 2.3rem; }
.tile.used { visibility: hidden; }
.hint-pic { text-align: center; font-size: 3.4rem; line-height: 1; }

.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

/* creator / camp */
.panel { background: var(--surface); border: 3px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 14px; }
.field { display: grid; gap: 8px; }
.field > span { font-weight: 800; }
.field input[type="text"], .field input[type="password"] {
  font: inherit; font-size: 1.2rem; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--soft); color: var(--fg); width: 100%;
}
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { border: 3px solid var(--line); border-radius: 12px; background: var(--soft); padding: 6px 12px; font-weight: 800; min-height: 48px; display: flex; align-items: center; gap: 6px; }
.choice[aria-pressed="true"] { border-color: var(--leaf); background: color-mix(in srgb, var(--leaf) 18%, var(--surface)); }
.choice img { width: 40px; height: 40px; image-rendering: pixelated; }
.swatch { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--line); padding: 0; }
.swatch[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 3px var(--gold); }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.item { border: 3px solid var(--line); border-radius: 12px; background: var(--soft); padding: 10px; display: grid; gap: 4px; justify-items: center; text-align: center; font-weight: 800; }
.item img { width: 72px; height: 72px; image-rendering: pixelated; }
.item[aria-pressed="true"] { border-color: var(--leaf); }
.item .price { display: flex; align-items: center; gap: 4px; font-family: var(--font-body); font-weight: 900; }
.item .price img { width: 22px; height: 22px; }
.note { margin: 0; font-weight: 700; min-height: 1.4em; }
.note.ok { color: var(--good); } .note.err { color: var(--bad); }
.parent-toggle { color: var(--muted); font-weight: 700; padding: 6px 0; justify-self: start; }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
#praise { position: fixed; inset: 0; z-index: 60; pointer-events: none; display: grid; place-items: center; padding-inline: 16px; text-align: center; }
#praise .big { font-family: var(--font-pixel); font-weight: 700; font-size: clamp(3rem, 15vw, 6rem); line-height: 1; color: var(--gold); -webkit-text-stroke: 3px #3a2a00; paint-order: stroke fill; filter: drop-shadow(0 6px 0 #3a2a00); }

@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }

/* players, parent panel extras */
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.player { border: 3px solid var(--wood-dark); border-radius: 14px; background: var(--surface); padding: 12px; display: grid; justify-items: center; gap: 6px; box-shadow: 0 5px 0 var(--wood-dark); font-weight: 800; }
.player img { width: 96px; height: 108px; image-rendering: pixelated; }
.player b { font-family: var(--font-pixel); font-size: 1.3rem; }
.player.add { border-style: dashed; box-shadow: none; align-content: center; min-height: 180px; }
.player .plus { font-family: var(--font-pixel); font-size: 3rem; line-height: 1; color: var(--leaf); }
.mini-coins { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.mini-coins img { width: 22px; height: 22px; image-rendering: pixelated; }
.savebox { display: grid; gap: 10px; padding: 10px; border-radius: 10px; background: var(--soft); }
.savebox textarea { font: 600 .85rem/1.35 ui-monospace, "SF Mono", Menlo, monospace; width: 100%; border: 2px solid var(--line); border-radius: 8px; padding: 8px; background: var(--surface); color: var(--fg); resize: vertical; }
.note.muted { font-weight: 700; color: var(--muted); }
.btn.danger { color: var(--bad); }
.sub.small { font-size: .95rem; }

/* camp building */
.item.build { gap: 6px; }
.item.build small { font-weight: 700; color: var(--muted); font-size: .85rem; line-height: 1.25; }
.item.build small.eff { color: var(--fg); }
.item.build[aria-disabled="true"] { opacity: .7; }
.ask { background: var(--surface); border: 3px solid var(--gold); border-radius: 14px; padding: 12px; display: grid; gap: 12px; }
.decor-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 2px dashed var(--line); border-radius: 12px; padding: 8px; }
.decor-chip { display: inline-flex; align-items: center; gap: 4px; border: 2px solid var(--line); border-radius: 10px; background: var(--soft); padding: 4px 8px; font-weight: 800; }
.decor-chip img { width: 32px; height: 32px; image-rendering: pixelated; }
.decor-chip[aria-pressed="true"] { border-color: var(--leaf); background: color-mix(in srgb, var(--leaf) 20%, var(--surface)); }

/* another tab saved newer progress */
.stale { position: fixed; inset: 0; z-index: 50; background: rgba(42,29,46,.55); display: grid; place-items: center; padding: 16px; }
.stale .panel { max-width: 420px; }
.stale h2 { font-size: 1.5rem; color: var(--leaf); }
.stale p { margin: 0; }

/* ---------- logic and time tasks ---------- */
.task { display: grid; justify-items: center; gap: 8px; margin: 4px 0 12px; text-align: center; }
.task-q { margin: 0; font-weight: 800; font-size: 1.25rem; }
.task .em, .opt .em { font-size: 2rem; line-height: 1; }
.task .em.big { font-size: 3.2rem; }
.clock { width: min(210px, 60vw); height: auto; aspect-ratio: 1; }
.clock.big { width: min(240px, 66vw); }
.clues { margin: 0; padding: 10px 14px 10px 34px; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; text-align: left; font-weight: 700; max-width: 100%; }
.clues li + li { margin-top: 4px; }
.seq { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; font-size: 2rem; line-height: 1; }
.seq .q { display: inline-grid; place-items: center; min-width: 2.2rem; border: 3px dashed var(--wood); border-radius: 10px; font-family: var(--font-body); font-weight: 900; font-size: 1.6rem; color: var(--wood-dark); }
.opts .opt { display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 1.1rem; line-height: 1.2; padding: 8px; }
.opts .opt .lb { font-family: var(--font-body); font-weight: 800; }
.opts .opt small { font-family: var(--font-body); font-size: .85rem; font-weight: 700; opacity: .8; }
.opts.times .opt .lb { font-family: var(--font-body); font-weight: 900; font-size: 1.9rem; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opts.wide { grid-template-columns: 1fr; }
.opts.wide .opt { grid-template-columns: auto 1fr; justify-items: start; text-align: left; gap: 10px; min-height: 60px; }
.opts.spans .opt { font-size: 1.15rem; }
.setclock { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; margin-bottom: 12px; }

/* ---------- world map ---------- */
.lands { display: grid; gap: 14px; margin: 8px 0 16px; }
.land { display: grid; gap: 4px; text-align: left; border: 3px solid var(--wood-dark); border-radius: 14px; background: var(--surface); padding: 10px; box-shadow: 0 5px 0 var(--wood-dark); font: inherit; color: inherit; cursor: pointer; }
.land canvas { width: 100%; height: auto; border-radius: 8px; image-rendering: pixelated; }
.land b { font-family: var(--font-pixel); font-size: 1.5rem; color: var(--leaf); }
.land span { font-weight: 700; color: var(--muted); }
.land.locked { filter: grayscale(.85); opacity: .75; }
.land.locked b::after { content: " 🔒"; }
.land:active:not(.locked) { transform: translateY(4px); box-shadow: 0 1px 0 var(--wood-dark); }

/* ---------- expedition rooms fit one screen ----------
   The controls keep their size and the scene gets whatever height is left, so the board,
   the dialog and the buttons are visible together on any phone or tablet. */
body.room { padding-block: 8px; }
body.room main { height: calc(100vh - 16px); height: calc(100dvh - 16px); grid-template-rows: auto minmax(110px, 1fr) auto auto; gap: 8px; }
body.room #sc { min-height: 0; display: flex; justify-content: center; align-items: center; overflow: hidden; }
body.room #sc canvas { width: auto; height: auto; max-width: 100%; max-height: 100%; }
body.room .hud { row-gap: 4px; }
body.room .trail span { width: 30px; height: 30px; }
body.room .trail img { width: 22px; height: 22px; }
body.room .runes { min-height: 28px; }
body.room .runes b { height: 28px; width: 26px; }
body.room .dialog { min-height: auto; padding: 8px 10px; gap: 8px; }
body.room .dialog .txt { min-height: calc(1.3em * 2); max-height: calc(1.3em * 4); overflow-y: auto; font-size: 1.1rem; line-height: 1.3; }
body.room .dialog .txt.long { font-size: 1rem; }
body.room .dialog .who { font-size: 1rem; }
body.room .dialog .say { width: 40px; height: 40px; }
body.room .ctl { gap: 8px; }
.dialog .txt.long { font-size: 1.1rem; }

/* short screens (most phones, tablets lying down): slimmer controls */
@media (max-height: 900px) {
  body.room .pad .btn { min-height: 54px; font-size: 1.7rem; }
  body.room .times .btn, body.room .run .btn { min-height: 48px; }
  body.room .program { min-height: 58px; padding: 6px; padding-top: 10px; }
  body.room .blk { width: 42px; height: 42px; font-size: 1.4rem; }
  body.room .card { min-height: 62px; font-size: 2.2rem; }
  body.room .cards { gap: 6px; grid-template-columns: repeat(auto-fit, minmax(52px, 1fr)); }
  body.room .sum { font-size: 1.5rem; }
  body.room .times { grid-template-columns: repeat(auto-fit, minmax(56px, 1fr)); gap: 8px; }
  body.room .times .wide { grid-column: auto; font-size: .8rem; line-height: 1.1; padding: 4px; }
  body.room .runes em { display: none; }
  body.room .spell { min-height: 58px; }
  body.room .spell img { width: 30px; height: 30px; }
  body.room .foe .power { padding: 2px 12px; }
  body.room .foe .power b { font-size: 2.1rem; }
  body.room .book { font-size: .8rem; gap: 2px 10px; }
  body.room .book img { width: 20px; height: 20px; }
  body.room .opts { gap: 8px; }
  body.room .opts .btn { min-height: 56px; }
  body.room .btn.num { font-size: 2rem; }
  body.room .btn.main { min-height: 52px; }
  body.room .clock { width: min(150px, 40vw); }
  body.room .clock.big { width: min(170px, 46vw); }
  body.room .task { gap: 4px; margin: 0 0 6px; }
  body.room .task-q { font-size: 1.05rem; }
  body.room .clues { padding: 6px 10px 6px 28px; font-size: .95rem; }
  body.room .seq { font-size: 1.6rem; }
}

/* very short screens (small phones): every pixel goes to the board */
@media (max-height: 700px) {
  body.room .runes:has(em) { display: none; }
  body.room .hud .trail { display: none; } /* the runes stay: they are needed for the chest */
  body.room .icon-btn { width: 40px; height: 40px; }
  body.room .hearts img, body.room .coins img { width: 22px; height: 22px; }
  body.room .trail span { width: 28px; height: 28px; }
  body.room .dialog .txt { max-height: calc(1.3em * 3); font-size: 1rem; }
  body.room .dialog .txt.long { font-size: .95rem; }
  body.room .pad .btn { min-height: 46px; }
  body.room .times .btn, body.room .run .btn, body.room .btn.main { min-height: 44px; }
  body.room .program { min-height: 50px; }
  body.room .blk { width: 38px; height: 38px; }
  body.room .limit { font-size: .85rem; line-height: 1.1; }
}

.castsum { display: none; font-family: var(--font-body); font-weight: 900; }
@media (max-height: 700px) {
  body.room main { grid-template-rows: auto minmax(90px, 1fr) auto auto; }
  body.room .sum { display: none; }
  body.room .castsum { display: inline; }
  body.room .spell { min-height: 46px; grid-template-columns: auto auto; column-gap: 4px; align-items: center; padding: 2px 4px; font-size: .9rem; }
  body.room .spell small { grid-column: 1 / -1; justify-self: center; }
  body.room .foe .power { font-size: .9rem; }
  body.room .foe .power img { width: 28px; height: 28px; }
}

/* landscape tablets and phones: scene on the left, conversation and controls on the right */
@media (orientation: landscape) and (min-width: 700px) {
  body.room main { max-width: 1200px; grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr); grid-template-rows: auto auto minmax(0, 1fr); grid-template-areas: "hud hud" "sc dlg" "sc ctl"; column-gap: 16px; }
  body.room .hud { grid-area: hud; flex-wrap: nowrap; }
  body.room .hud .trail { width: auto; flex: 1; }
  body.room .hud .runes { width: auto; }
  body.room #sc { grid-area: sc; align-items: flex-start; }
  body.room .dialog { grid-area: dlg; }
  body.room #ctl { grid-area: ctl; min-height: 0; overflow-y: auto; align-content: start; }
}

/* camp: the scene never pushes the expedition button off a phone screen; side by side when lying down */
body.campview #sc canvas { width: auto; max-width: 100%; max-height: 42vh; max-height: 42dvh; margin: 0 auto; }
@media (orientation: landscape) and (min-width: 700px) {
  body.campview main { max-width: 1200px; grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr); column-gap: 16px; row-gap: 0; align-content: start; }
  body.campview main > * { grid-column: 2; margin-bottom: 14px; }
  body.campview main > #sc { grid-column: 1; grid-row: 1 / span 30; align-self: start; position: sticky; top: 8px; }
  body.campview #sc canvas { max-height: calc(100dvh - 24px); }
  body.campview h1 { font-size: 2rem; }
}

/* ---------- money: coins and notes that look like the real ones ---------- */
.coins small { font-size: .85rem; margin-left: 2px; }
.coins img.gr { margin-left: 8px; }
.btn.num small { font-size: .5em; margin-left: 4px; }
.btn.num { white-space: nowrap; }
.mini-coins { font-weight: 800; }
.piece { position: relative; width: 52px; height: 52px; border-radius: 50%; display: inline-grid; place-content: center; line-height: .9; font-family: var(--font-body); color: #2a2a2a;
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.18), 0 3px 0 rgba(0,0,0,.25); flex: none; }
.piece b { font-weight: 900; font-size: 1.25rem; } .piece small { font-size: .7rem; font-weight: 800; }
.piece.zl1, .piece.gr-silver { background: radial-gradient(circle at 35% 30%, #f4f6f8, #b9c0c8 70%, #8f98a2); }
.piece.zl2 { background: radial-gradient(circle, #ecc95e 0 52%, #c9ced4 54% 100%); }

.piece.gr-silver { width: 46px; height: 46px; }
.piece.note { width: 78px; height: 44px; border-radius: 6px; grid-auto-flow: column; gap: 4px; align-items: baseline; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
.piece.n10 { background: linear-gradient(135deg, #b98f5f, #8f6a3f); }
.piece.n20 { background: linear-gradient(135deg, #a07cc0, #6f4f94); }
.piece.n50 { background: linear-gradient(135deg, #5d8fd0, #2f5f9e); }
.payov { position: fixed; inset: 0; z-index: 40; background: rgba(42,29,46,.5); display: grid; place-items: center; padding: 12px; overflow-y: auto; }
.paybox { max-width: 520px; width: 100%; display: grid; gap: 8px; }
.paybox .lbl, .piggy .lbl { margin: 0; font-weight: 800; color: var(--muted); }
.wallet, .counter { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; min-height: 58px; padding: 6px; border-radius: 12px; }
.wallet { background: var(--soft); }
.counter { background: #e9d9b4; border: 3px dashed var(--wood); }
.stack { display: inline-flex; align-items: center; gap: 2px; }
.stack i { font-style: normal; font-weight: 900; color: var(--wood-dark); }
.piggy { display: grid; gap: 10px; }
/* rooms on narrow screens: hearts, wallet and the two buttons share one row */
@media (max-width: 480px) {
  body.room .hud { gap: 6px; }
  body.room .hearts img { width: 20px; height: 20px; }

    return new Promise((resolve) => {
      const run = GS.RUN, took = timer();
      $("ctl").innerHTML = `<div class="task">${o.head || ""}</div>

      if (window.__LW_TEST) window.__LW_TEST.q = { kind: q.kind, ans: q.ans };

        const op = q.opts.find((x) => x.a === a);

      };

      app.querySelectorAll("#ctl .opt").forEach((b) => b.addEventListener("click", async () => {
        if (done || b.disabled) return;
        const a = b.dataset.a;
        if (a === q.ans) {
          done = true;
          b.classList.add("right");
          snd.ok();
          burst(b);
          record(o.skill, misses === 0, took(), o.note(misses));
          save();
          resolve({ ok: misses === 0 });

        }
        misses++;
        b.classList.add("wrong");
        b.disabled = true;
        b.classList.remove("shake");
        void b.offsetWidth;
        b.classList.add("shake");
        if (misses === 1) {

          say(petName(), `Hmm, to nie to. ${q.why(a)}`);

    }

  function exchange() {
    const coins = piggyCoins(GS.G.gr, pick).map((s) => ({ d: s.d, n: s.n })), chosen = [], took = timer();
    let misses = 0;
    const sum = () => chosen.reduce((a, d) => a + d.v, 0);
    const render = () => {
      const s = sum();
      $("pig").innerHTML = `<p class="task-q"><span class="em big">\u{1F437}</span><br>W skarbonce jest <b>${GS.G.gr} gr</b>. Wybierz monety, kt\xF3re razem daj\u0105 <b>100 gr</b>.</p>
      <div class="wallet">${coins.filter((c) => c.n).map((c) => `<span class="stack">${pieceHTML(c.d, "gr", `data-w="${c.d.v}"`)}${c.n > 1 ? `<i>\xD7${c.n}</i>` : ""}</span>`).join("")}</div>

      if (window.__LW_TEST) window.__LW_TEST.piggy = { sum: s, coins: coins.flatMap((c) => Array(c.n).fill(c.d.v)) };
      $("pig").querySelectorAll("[data-w]").forEach((b) => b.addEventListener("click", () => {
        const c = coins.find((x) => x.d.v === +b.dataset.w);
        if (!c || !c.n) return;
        c.n--;
        chosen.push(c.d);
        snd.coin();
        render();
        if (sum() > 100) {
          misses++;
          say(petName(), "Za du\u017Co! Z\u0142ot\xF3wka to dok\u0142adnie sto groszy. Zabierz kt\xF3r\u0105\u015B monet\u0119 z powrotem.");
        }
      }));
      $("pig").querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => {
        const d = chosen.splice(+b.dataset.c, 1)[0];
        coins.find((x) => x.d.v === d.v).n++;
        snd.letter();
        render();
      }));
      $("swapBtn").addEventListener("click", () => {
        if (sum() !== 100) return;
        GS.G.gr -= 100;
        GS.G.coins += 1;
        record("money.exchange", misses === 0, took(), `${chosen.map((d) => d.v).join(" + ")} = 100 gr`);
        save();
        snd.fanfare();
        burst($("swapBtn"), 30);
        $("coinN").textContent = GS.G.coins;
        if ($("grN")) $("grN").textContent = GS.G.gr;
        say(petName(), `${chosen.map((d) => d.v).join(" plus ")} to sto groszy, czyli jeden z\u0142oty! Masz ju\u017C ${GS.G.coins} z\u0142.`);
        setTimeout(() => GS.G.gr >= 100 ? exchange() : missing(), 1600);
      });
    };
    render();
    say(petName(), `Mamy ${gr(GS.G.gr)}! Wybierz monety, kt\xF3re razem daj\u0105 sto groszy, a wymienimy je na z\u0142ot\xF3wk\u0119.`);
  }

  function sha256js(text) {
    const msg = new TextEncoder().encode(text), len = msg.length;
    const n = len + 9 + 63 >> 6 << 6, buf = new Uint8Array(n);
    buf.set(msg);
    buf[len] = 128;
    const bits = len * 8, dv = new DataView(buf.buffer);
    dv.setUint32(n - 8, Math.floor(bits / 4294967296));
    dv.setUint32(n - 4, bits >>> 0);
    const H = new Uint32Array([1779033703, 3144134277, 1013904242, 2773480762, 1359893119, 2600822924, 528734635, 1541459225]);
    const W = new Uint32Array(64), rot = (x, r) => x >>> r | x << 32 - r;
    for (let off = 0; off < n; off += 64) {
      for (let i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rot(W[i - 15], 7) ^ rot(W[i - 15], 18) ^ W[i - 15] >>> 3, s1 = rot(W[i - 2], 17) ^ rot(W[i - 2], 19) ^ W[i - 2] >>> 10;
        W[i] = W[i - 16] + s0 + W[i - 7] + s1 | 0;
      }
      let [a, b, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const t1 = h + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + (e & f ^ ~e & g) + K[i] + W[i] | 0;
        const t2 = (rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + (a & b ^ a & c ^ b & c) | 0;
        h = g;
        g = f;
        f = e;
        e = d + t1 | 0;
        d = c;
        c = b;
        b = a;
        a = t1 + t2 | 0;
      }
      H[0] += a;
      H[1] += b;
      H[2] += c;
      H[3] += d;
      H[4] += e;
      H[5] += f;
      H[6] += g;
      H[7] += h;
    }
    return Array.from(H, (v) => v.toString(16).padStart(8, "0")).join("");
  }

  // src/parent.js
  async function sha256(t) {
    if (!(window.crypto && crypto.subtle)) return sha256js(t);
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return Array.from(new Uint8Array(b)).map((v) => v.toString(16).padStart(2, "0")).join("");
  }

  function wireParent(onLeave) {

      C.beds.forEach((b, i) => {
        const bx = (5 + i) * 16, by = 4 * 16;
        x.fillStyle = "#8a5a34";
        x.fillRect(bx + 1, by + 9, 14, 6);
        x.fillStyle = "#6e4626";
        x.fillRect(bx + 1, by + 13, 14, 2);
        draw(x, PLANT_SPR[b.p][b.s], bx, by - 2 - (b.s === RIPE ? bob(t, i) : 0), 1, true);
        if (b.s === RIPE && !reduced() && Math.floor(t / 400 + i) % 3 === 0) {

    cv.c.addEventListener("click", (e) => {

      const lx = (e.clientX - r0.left - b) / (r0.width - 2 * b) * CAMP_COLS * 16, ly = (e.clientY - r0.top - b) / (r0.height - 2 * b) * CAMP_ROWS * 16;
      const c = Math.floor(lx / 16), r = Math.floor(ly / 16);

    function harvest(i, e) {
      const bed = C.beds[i];
      if (bed.s < RIPE) {
        say(petName(), `Ta grz\u0105dka jeszcze ro\u015Bnie. Po ${RIPE - bed.s === 1 ? "nast\u0119pnej wyprawie" : `${RIPE - bed.s} wyprawach`} b\u0119dzie plon.`);

    function editTap(c, r) {
      if (c < 0 || r < 1 || c >= CAMP_COLS || r >= CAMP_ROWS || blocked.has(`${c},${r}`)) {

  // src/profiles.js
  function repair(p) {
    const h = p.hero;
    if (!h.name) h.name = h.gender === "boy" ? "Bohater" : "Bohaterka";
    if (h.gender !== "boy") h.gender = "girl";
    if (!HAIR[h.hair] || (HAIR[h.hair].gender || "girl") !== h.gender) h.hair = h.gender === "boy" ? "bshort" : "tails";
    const color = (v, list) => typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v) ? v : list[0];
    h.hairColor = color(h.hairColor, HAIRC);
    h.skin = color(h.skin, SKINS);
    h.outfit = color(h.outfit, OUTFITS);
    p.pets = p.pets.filter((k, i) => PETS[k] && p.pets.indexOf(k) === i);
    if (!p.pets.length) p.pets = ["cat"];
    if (!PETS[h.pet] || !p.pets.includes(h.pet)) h.pet = p.pets[0];
    p.owned = p.owned.filter((k, i) => HATS[k] && p.owned.indexOf(k) === i);
    if (!p.owned.includes("none")) p.owned.unshift("none");
    if (!HATS[h.hat] || !p.owned.includes(h.hat)) h.hat = "none";
  }
  function boot() {
    for (const p of profiles()) if (!p.hero) removeProfile(p.id);
    profiles().forEach(repair);
    if (profiles().length) save();
    if (!GS.DB.settings.pinHash) return pinSetup(boot);
    const list = profiles();
    if (!list.length) return creator(false, true);
    if (list.length === 1) {
      selectProfile(list[0].id);
      rebuildHero();
      return camp();
    }
    whoPlays();
  }

    <p class="sub">Witaj! Zanim dziecko zacznie gra\u0107, ustaw PIN rodzica.</p>
    <form class="panel" id="pinSet" novalidate>
      <p class="note muted">PIN otwiera panel rodzica: poziom trudno\u015Bci, kopi\u0119 zapisu gry i usuwanie graczy. Wybierz od 4 do 8 cyfr, kt\xF3rych dziecko nie zna.</p>
      <label class="field"><span>PIN</span><input type="password" id="pin1" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="new-password"></label>
      <label class="field"><span>Powt\xF3rz PIN</span><input type="password" id="pin2" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="new-password"></label>
      <button class="btn main" type="submit">Zapisz PIN i zaczynamy</button>
      <p class="note err" id="pinSetMsg" role="status"></p>
    </form>
    <p class="sub small">Masz kopi\u0119 zapisu z innego urz\u0105dzenia? Wczytasz j\u0105 p\xF3\u017Aniej w panelu \u201EDla rodzica\u201D.</p>`;
    $("pin1").focus();
    $("pinSet").addEventListener("submit", async (e) => {
      e.preventDefault();
      const a = $("pin1").value, b = $("pin2").value;
      if (!validPin(a)) {
        $("pinSetMsg").textContent = "PIN musi mie\u0107 od 4 do 8 cyfr.";
        return;
      }
      if (a !== b) {
        $("pinSetMsg").textContent = "PIN-y si\u0119 r\xF3\u017Cni\u0105. Wpisz ten sam dwa razy.";
        return;
      }
      GS.DB.settings.pinHash = await sha256(a);
      save();
      next();
    });
  }
  function whoPlays() {
    GS.scene = null;
    const list = profiles();
    app.innerHTML = `<h1>Kto gra?</h1>
    <div class="players">${list.map((p) => `<button class="player" data-id="${p.id}">
        <img src="${url(heroSprite(p.hero))}" alt="">
        <b>${esc(p.hero.name)}</b>
        <span class="mini-coins"><img src="${ICON.coin}" alt="">${p.coins} z\u0142</span></button>`).join("")}
      <button class="player add" id="addPlayer"><span class="plus" aria-hidden="true">+</span><b>Nowy gracz</b></button>
    </div>`;
    app.querySelectorAll(".player[data-id]").forEach((b) => b.addEventListener("click", () => {
      snd.letter();
      selectProfile(b.dataset.id);
      rebuildHero();
      camp();
    }));
    $("addPlayer").addEventListener("click", () => creator(false, true));
    try {
      window.scrollTo({ top: 0 });
    } catch (e) {
    }
  }

  // src/main.js
  var appEl = document.getElementById("app");
  new MutationObserver(() => {
    document.body.classList.toggle("room", !!appEl.querySelector(":scope > #ctl"));
    document.body.classList.toggle("campview", !!appEl.querySelector(":scope > #tripBtn"));
  }).observe(appEl, { childList: true });
  boot();
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
      });
    });
  }
})();

</script>
</body>
</html>
